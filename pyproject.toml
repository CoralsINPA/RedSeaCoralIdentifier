[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coralid"
dynamic = ["version"]
description = "Genus-level coral identification for Red Sea reef photos: CoralSCOP segmentation plus zero-shot CLIP-family classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "opencv-python-headless>=4.8",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "tqdm>=4.66",
]

# torch is deliberately not pinned: use whatever the runtime (Colab) already ships.
[project.optional-dependencies]
clip = [
    "torch",
    "torchvision",
    "open_clip_torch>=3.3,<4",
    "transformers>=4.50",
]
dino = [
    "torch",
    "torchvision",
    "transformers",
]
segment = [
    "torch",
    "torchvision",
]
cluster = [
    "scikit-learn",
    "umap-learn",
    "hdbscan",
]
viz = [
    "matplotlib",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "nbstripout",
    "scikit-learn",
]

[tool.setuptools.dynamic]
version = { attr = "coralid.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]
# The legacy notebooks are frozen reference evidence (Colab magics, copy-pasted cells).
extend-exclude = ["notebooks/legacy", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["coralid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pycocotools (a C extension) trips a numpy 2 copy-keyword deprecation inside mask.decode.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
