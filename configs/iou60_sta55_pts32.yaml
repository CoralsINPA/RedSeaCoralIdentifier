# Active run: SAM points_per_side 32, pred_iou 0.60, stability 0.55, min_mask_region_area 100.
# Paths are relative to the data root. Leave data_root empty to use $CORALID_DATA_ROOT.
paths:
  data_root: null
  images_dir: data_all
  results_dir: results_all
  json_dir: json
  manifest_dir: manifest
  features_dir: features
  predictions_dir: predictions
  reviews_dir: reviews
  reports_dir: reports
  segmentation_dir: segmentation
  ground_truth_csv: ground_truth_genus_counts.csv
  run_prefix: ""  # put in front of the run name; only scratch runs use it (the segmentation check)
sam:
  model_type: vit_b
  checkpoint: CoralSCOP/checkpoints/vit_b_coralscop.pth
  points_per_side: 32
  pred_iou_thresh: 0.6
  stability_score_thresh: 0.55
  crop_n_layers: 1
  crop_n_points_downscale_factor: 2
  min_mask_region_area: 100
  max_side: 2560
  save_features: false  # true: also keep CoralSCOP's cate_preds and fc_features (sidecar files)
filters:
  min_area: 25000
  containment_thresh: 0.8
  max_aspect_ratio: 3.0
  sharpness_threshold: 80.0
  sharpness_crop: masked  # masked: the pipeline's measure (threshold 80); bbox: the unmasked box (150)
  sharpness_threshold_bbox: 150.0
crops:
  mode: masked
  background: black
  padding_pct: 0.05
  bbox_padding_pct: 0.15
  min_visible: 500
zero_shot:
  model: finetuned-bioclip
  label_set: hard20
  prompt_format: taxonomy
  prompt_set: taxonomy_v1
  batch_size: 64
  logit_scale: 100.0
# Exploration direction (embeddings and clustering): NOT part of the pipeline. Nothing in the
# pipeline reads this section; only `python -m coralid explore-embed` does.
explore:
  model: dinov2-s14  # or dinovdeau-l; the batch size is the model's own unless set here
  batch_size: null
probe:
  features: finetuned-bioclip__masked  # file stem in <run>/features/
  labels: null  # a labels table: image_name, coral_id and the label column
  label_column: genus
  label_set: hard20
  n_splits: 5
  C: 1.0
  class_weight: balanced
  standardize: true
  max_iter: 2000
  seed: 0
