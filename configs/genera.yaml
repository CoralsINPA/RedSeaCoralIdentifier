# Label sets and prompt sets for zero-shot classification.
#
# Everything under `prompt_sets` is copied character for character from the legacy notebooks
# (notebooks/legacy/). Do not "fix" a prompt here: a changed prompt changes the predictions.
# New wording belongs in a new, versioned prompt set (for example taxonomy_v3).
#
# Order matters. The genus order of a label set is the column order of every prediction table
# and decides ties (the first genus in this order wins).
#
# `kind` says which prompt format uses a set: taxonomy, descriptive, common or hybrid.
# `incomplete: true` marks a set that lacks prompts for some genera of the label set it was
# written for. Using it with a label set it does not cover raises an error.

label_sets:
  hard20:
    description: "The 20 hard-coral genera of the final label set (decided 2026-10-11)."
    genera:
      - Platygyra
      - Acropora
      - Stylophora
      - Millepora
      - Favites
      - Dipsastraea
      - Favia
      - Echinopora
      - Hydnophora
      - Porites
      - Acanthastrea
      - Cyphastrea
      - Goniastrea
      - Seriatopora
      - Pocillopora
      - Montipora
      - Leptastrea
      - Galaxea
      - Lobophyllia
      - Pavona

# The 4 soft corals of the V2 pipeline are not a label set. They are listed so that expert labels
# and legacy V2 tables can be recognised as "known, but outside the label set".
soft_genera:
  - Cladiella
  - Sinularia
  - Litophyton
  - Sarcophyton

